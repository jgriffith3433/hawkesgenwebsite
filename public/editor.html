<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="preload" href="/fonts/rajdhani-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <title>Hawkes Gen</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/public.css">
  <link rel="stylesheet" href="/studio.css?v=engine13">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="https://gen.hawkesgen.com/sdk/analytics@1.js" data-product="hawkesgen" defer></script>
  <script src="/site-analytics.js"></script>
</head>
<body class="studio">
  <!-- Coming in from the site: the light fades to the game -->
  <div class="st-enter" id="enter"></div>

  <!-- Boot sequence (once per game) -->
  <div class="boot-overlay" id="bootOverlay">
    <div class="boot-content">
      <div class="boot-logo" id="bootLogo">HAWKES GEN</div>
      <div class="boot-sub" id="bootSub">GAME ENGINE</div>
      <div class="boot-lines" id="bootLines"></div>
    </div>
  </div>

  <!-- The game itself: the world you build in, running in a sandbox (play/play.html + build.js) -->
  <iframe id="stage" class="st-stage" title="Your game" src="/play/_draft" sandbox="allow-scripts allow-pointer-lock allow-popups allow-popups-to-escape-sandbox" allow="fullscreen; autoplay"></iframe>

  <!-- Corners of the screen, like a game: the menu and who's here; saving and errors -->
  <div class="st-corner left">
    <button class="st-hud-btn" id="menuBtn" type="button" title="Menu (Esc)" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button class="st-hud-btn" id="libraryBtn" type="button" title="Create" aria-label="Create">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <span class="st-presence" id="presence"></span>
  </div>
  <div class="st-corner right">
    <span class="st-save" id="saveState"></span>
    <div class="st-errors" id="errorsContainer" hidden>
      <button class="st-error-pill" id="errorPill" type="button"><span id="errorCount">0</span> errors</button>
      <div class="st-error-panel" id="errorPanel" hidden><div id="errorList"></div><button class="st-btn" id="askFix" type="button">Ask the assistant to fix these</button></div>
    </div>
    <button class="st-hud-btn" id="advancedBtn" type="button" title="Advanced: code, assets, settings" aria-label="Advanced">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M5.5 4L2 8l3.5 4M10.5 4L14 8l-3.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- Save: a point in the game's history (building only; the game itself is always live) -->
  <button class="st-savebtn" id="saveBtn" type="button" title="Save (Ctrl+S): a point in the history you can come back to">
    <span class="dot"></span><span class="lbl" id="saveLbl">Save</span>
  </button>

  <!-- The assistant, as game chat: the last lines fade out above the input -->
  <section class="st-chat" id="ai">
    <div class="st-chat-log" id="chatLog"></div>
    <div class="st-chat-status" id="thinkingIndicator" hidden>working…</div>
    <form class="st-chat-input" id="chatForm" autocomplete="off">
      <span class="st-mention" id="mention" hidden><span id="mentionName"></span><button type="button" id="mentionX" aria-label="Remove">×</button></span>
      <input id="chatInput" type="text" enterkeyhint="send" placeholder="Press Enter to talk to the Overseer" aria-label="Message the Overseer, the builder" maxlength="4000">
      <span class="st-chat-cost" id="chatCost"></span>
    </form>
  </section>

  <!-- Left: Create: the basics, and anything you've made, put where you're looking -->
  <aside class="st-panel left" id="library" aria-label="Create">
    <div class="st-panel-head">
      <span class="st-panel-title">Create</span>
      <span class="grow"></span>
      <button class="st-btn icon" id="libraryClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="st-lib-tabs" id="libTabs">
      <button type="button" class="on" data-k="basics">Basics</button>
      <button type="button" data-k="community">Community</button>
      <button type="button" data-k="game">In this game</button>
      <button type="button" data-k="">Yours</button>
      <button type="button" data-k="model">3D</button>
      <button type="button" data-k="image">Pictures</button>
      <button type="button" data-k="audio">Sounds</button>
      <button type="button" data-k="video">Videos</button>
    </div>
    <div class="st-lib-search" id="libSearchRow" hidden>
      <input id="libSearch" type="search" placeholder="Search: ball, grass, rain, laser…" autocomplete="off" spellcheck="false">
      <div class="st-lib-sort" id="libSort"><button type="button" class="on" data-s="liked" title="What the most other builders used">Most liked</button><button type="button" data-s="new">New</button><button type="button" data-s="fresh" title="The least used first, so your game doesn't look like every other one">Hidden gems</button></div>
      <div class="st-lib-chips" id="libChips"></div>
    </div>
    <p class="st-lib-note" id="libNote">Click one to put it where you're looking. Then double-click it to change it, or tell the assistant what it should do.</p>
    <div class="st-lib-grid" id="libGrid"></div>
    <div class="st-lib-foot"><a href="/app/studio" target="_blank" class="st-btn small">Make something new in the Asset studio</a></div>
  </aside>

  <!-- Right: Advanced (files and code, game assets, settings, the docs) -->
  <aside class="st-panel right" id="drawer" aria-label="Advanced">
    <div class="st-panel-head">
      <div class="st-tabs" role="tablist">
        <button type="button" class="on" data-tab="code">Code</button>
        <button type="button" data-tab="assets">Assets</button>
        <button type="button" data-tab="settings">Settings</button>
        <button type="button" data-tab="docs">Docs</button>
      </div>
      <button class="st-btn icon" id="drawerClose" type="button" aria-label="Close">×</button>
    </div>
    <label class="st-switch"><input type="checkbox" id="advTools"> Advanced tools in the world (move handles, code buttons)</label>

    <div class="st-pane" data-pane="code">
      <div class="st-files">
        <div class="st-files-head"><span class="label">Files</span><button class="st-btn small" id="newFileBtn" type="button">+ File</button></div>
        <div id="filesList"></div>
      </div>
      <div class="st-code">
        <div id="conflict" class="st-conflict" hidden>
          <span class="grow">Someone else changed this file while you were typing.</span>
          <button class="st-btn small" id="conflictKeep" type="button">Keep mine</button>
          <button class="st-btn small" id="conflictTake" type="button">Take theirs</button>
        </div>
        <div class="st-code-head">
          <span id="openFile" class="grow"></span>
          <button class="st-btn small" id="renameFileBtn" type="button" hidden>Rename</button>
          <button class="st-btn small" id="deleteFileBtn" type="button" hidden>Delete</button>
        </div>
        <div id="editor" class="st-cm"></div>
      </div>
    </div>

    <div class="st-pane" data-pane="assets" hidden>
      <div class="st-files-head"><span class="label">In this game</span><span><button class="st-btn small" id="newAssetBtn" type="button">By asset id</button> <button class="st-btn small" id="openLibrary2" type="button">+ From your library</button></span></div>
      <div id="assetsList"></div>
      <div id="gensList"></div>
    </div>

    <div class="st-pane" data-pane="settings" hidden>
      <section>
        <label class="label">Name</label>
        <input type="text" class="form-input" id="gameTitle" maxlength="80">
        <label class="label">About the game</label>
        <textarea class="form-input" id="descInput" placeholder="What's your game about?" maxlength="400" rows="3"></textarea>
        <div class="segmented">
          <button type="button" class="on" data-vis="public">Public</button>
          <button type="button" data-vis="unlisted">Unlisted</button>
        </div>
        <input type="text" class="form-input" id="coverInput" placeholder="Cover image: an asset name">
        <button class="st-btn" id="saveSettingsBtn" type="button">Save</button>
      </section>
      <section>
        <label class="label">People</label>
        <div id="membersList"></div>
      </section>
      <section>
        <label class="label">Saves</label>
        <div id="releasesList"></div>
      </section>
      <section>
        <button class="st-btn" id="leaveBtn" type="button">Leave game</button>
        <button class="st-btn bad" id="deleteGameBtn" type="button" hidden>Delete game</button>
      </section>
    </div>

    <div class="st-pane" data-pane="docs" hidden>
      <div class="docs" id="docsContent"></div>
    </div>
  </aside>

  <!-- The menu (Esc twice, or the ≡ button): a game's pause menu -->
  <div class="st-menu" id="menu" hidden>
    <div class="st-menu-card">
      <div class="st-menu-who">
        <span class="st-menu-avatar" id="profileAvatar">?</span>
        <div><div class="st-menu-name" id="menuName"></div><div class="st-menu-sub" id="menuSub"></div></div>
      </div>
      <div class="st-menu-game" id="menuGame"></div>
      <nav class="st-menu-list">
        <button type="button" class="st-menu-item primary" data-act="resume">Back to the game</button>
        <button type="button" class="st-menu-item" data-act="mode">Play the game</button>
        <button type="button" class="st-menu-item" data-act="look">Change who you are</button>
        <button type="button" class="st-menu-item" data-act="invite">Invite friends to build</button>
        <button type="button" class="st-menu-item" data-act="saves">Saves (history)</button>
        <button type="button" class="st-menu-item" data-act="people">People and permissions</button>
        <button type="button" class="st-menu-item" data-act="library">Create</button>
        <button type="button" class="st-menu-item" data-act="advanced">Advanced (code, settings)</button>
        <button type="button" class="st-menu-item" data-act="codex">How things work</button>
        <label class="st-menu-item check"><input type="checkbox" id="speechCaptions" checked> Captions for the Overseer's voice</label>
        <label class="st-menu-item check">Overseer voice <input type="range" id="speechVoice" min="0" max="100" value="100" aria-label="Overseer voice volume"></label>
        <label class="st-menu-item check">Music <input type="range" id="speechMusic" min="0" max="100" value="100" aria-label="Music volume"></label>
        <button type="button" class="st-menu-item" id="speechReplay">Replay the Overseer's last line</button>
        <button type="button" class="st-menu-item" data-act="exit">Exit to my games</button>
        <button type="button" class="st-menu-item dim" data-act="logout">Sign out</button>
      </nav>
      <div class="st-menu-friends" id="profileFriends"></div>
      <div class="st-menu-sheet" id="menuSheet" hidden></div>
    </div>
  </div>

  <!-- Add an asset by its id -->
  <div class="modal-backdrop" id="assetModal" hidden>
    <div class="modal" style="max-width:520px">
      <h3 style="margin:0 0 14px">Add by asset id</h3>
      <div class="form-field"><label>Asset ID</label><input type="text" class="form-input" id="assetId" placeholder="a_abc123..."></div>
      <div class="form-field"><label>Name in your game</label><input type="text" class="form-input" id="assetName" placeholder="hero.glb"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" id="addAssetConfirmBtn" type="button">Add</button>
        <button class="btn btn-ghost btn-sm" data-close="assetModal" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="/editor.js?v=engine12"></script>
</body>
</html>
