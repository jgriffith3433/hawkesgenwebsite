<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Something broke — Hawkes Games</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a0e1a">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #e4ecf4; font: 400 17px/1.55 Inter, system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at 50% 38%, #163447 0%, #0a0e1a 62%); }
    main { max-width: 440px; text-align: center; }
    .pearl { width: 112px; height: 112px; margin: 0 auto 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0%, #aef5df 14%, #4fc3a4 44%, #1b4a62 100%); box-shadow: 0 0 60px 8px rgba(63,208,164,.35); }
    .eyebrow { font: 500 13px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: #8fb3c4; }
    h1 { font: 600 34px/1.15 Inter, system-ui, sans-serif; margin: 12px 0 10px; color: #fff; }
    p { margin: 0 0 26px; color: #b9cad6; }
    .go { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a, button { font: 500 16px/1 inherit; min-height: 44px; box-sizing: border-box; padding: 0 20px; display: inline-flex; align-items: center; border-radius: 10px; text-decoration: none; cursor: pointer; }
    .primary { background: #3fd0a4; color: #05281e; border: 0; }
    .second { border: 1px solid rgba(255,255,255,.25); color: #e4ecf4; background: transparent; }
    a:focus-visible, button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="pearl" aria-hidden="true"></div>
    <div class="eyebrow">500 · error</div>
    <h1>That one was on us.</h1>
    <p>Something went wrong on our side. Nothing you did, and nothing of yours was lost. Try again in a moment.</p>
    <div class="go"><button class="primary" onclick="location.reload()">Try again</button><a class="second" href="/">Go home</a><a class="second" href="/play/sandbox">Go to the island</a></div>
  </main>
</body>
</html>
