<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Join an org — Hawkes</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/public.css">
  <link rel="stylesheet" href="/site.css">
</head>
<body class="landing">
  <header class="hg-navbar"><div class="wrap hg-navbar-inner"><a href="/home" class="hg-brand"><span class="wordmark">Hawkes Games</span></a></div></header>
  <main class="wrap">
    <div class="auth-inline-wrap" style="max-width:460px">
      <div class="label">Join an org</div>
      <h3 style="font:400 32px/1.1 var(--serif);margin:10px 0 6px" id="title">Loading…</h3>
      <p class="muted" id="lede" style="margin:0 0 20px"></p>
      <a class="btn btn-secondary btn-lg" id="googleBtn" href="#" style="width:100%" hidden>Continue with Google</a>
      <div style="display:flex;gap:10px" id="actions" hidden>
        <button class="btn btn-primary btn-lg" type="button" id="join" style="flex:1">Join</button>
        <a class="btn btn-secondary btn-lg" href="/app">Not now</a>
      </div>
      <div class="form-error" id="err" hidden></div>
    </div>
  </main>
  <script defer src="/google-gate.js"></script>
  <script type="module">
    // The invite's token rides in the hash (never sent to a server in a URL or a Referer); it waits in sessionStorage
    // while the person signs in with Google, which brings them back here without the hash.
    const $ = (id) => document.getElementById(id);
    const fail = (m) => { $('err').textContent = m; $('err').hidden = false; };
    const KEY = 'hg_org_invite';
    let token = location.hash.slice(1);
    try { if (token) sessionStorage.setItem(KEY, token); else token = sessionStorage.getItem(KEY) || ''; } catch {}
    if (location.hash) history.replaceState(null, '', location.pathname);
    const post = async (path, body) => {
      const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'That did not work');
      return d;
    };
    async function start() {
      if (!token) { $('title').textContent = "This link didn't work"; return fail('Open the link from your invite email again.'); }
      const me = await fetch('/v1/users/me?soft=1').then((x) => (x.ok ? x.json() : null)).catch(() => null);
      if (!me?.user) {
        $('title').textContent = 'Sign in to join';
        $('lede').textContent = 'Sign in with the Google account the invite was sent to.';
        $('googleBtn').href = `/auth/google?next=${encodeURIComponent(location.pathname)}`;
        $('googleBtn').hidden = false;
        return;
      }
      try {
        const i = await post('/v1/orgs/invites/peek', { token });
        $('title').textContent = `Join ${i.org.name}`;
        $('lede').textContent = i.matches ? `You're invited as ${i.role === 'admin' ? 'an' : 'a'} ${i.role}.` : `This invite is for ${i.email}, and you're signed in as ${i.you}. Sign out and sign in with that account to join.`;
        $('actions').hidden = !i.matches;
      } catch (x) { $('title').textContent = "This link didn't work"; fail(x.message); }
    }
    $('join').onclick = async () => {
      $('join').disabled = true;
      try {
        const d = await post('/v1/orgs/invites/accept', { token });
        try { sessionStorage.removeItem(KEY); } catch {}
        $('title').textContent = `You're in ${d.org.name}`;
        $('lede').textContent = 'Taking you to your games…';
        $('actions').hidden = true;
        setTimeout(() => { location.href = '/app'; }, 1200);
      } catch (x) { fail(x.message); $('join').disabled = false; }
    };
    start();
  </script>
  <script src="/enter.js"></script>
</body>
</html>
