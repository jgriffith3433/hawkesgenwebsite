<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin — Hawkes Gen</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/public.css">
</head>
<body>
  <header class="hg-navbar">
    <div class="wrap hg-navbar-inner">
      <a href="/" class="hg-brand"><span class="wordmark">Hawkes Gen</span><span class="hg-brand-badge">Admin</span></a>
      <div class="hg-nav-actions" id="who" hidden>
        <span class="muted" id="whoEmail" style="font-size:13px"></span>
        <a class="btn btn-ghost btn-sm" href="/app">Studio</a>
        <button type="button" class="btn btn-ghost btn-sm" id="signOut">Sign out</button>
      </div>
    </div>
  </header>

  <!-- Not signed in as an admin -->
  <div class="wrap" id="gate" hidden>
    <form class="auth-inline-wrap form-grid" id="gateForm">
      <h3 style="font:400 30px/1.1 var(--serif)">Admin sign-in</h3>
      <div class="form-field"><label for="gEmail">Email</label><input id="gEmail" type="email" class="form-input" autocomplete="email" required></div>
      <div class="form-field"><label for="gPassword">Password</label><input id="gPassword" type="password" class="form-input" autocomplete="current-password" required></div>
      <div class="form-error" id="gError" hidden></div>
      <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
    </form>
  </div>

  <main class="wrap" id="admin" hidden style="padding-top:28px;padding-bottom:80px">
    <nav class="admin-tabs" id="tabs">
      <button type="button" data-tab="overview" class="on">Overview</button>
      <button type="button" data-tab="accounts">Accounts</button>
      <button type="button" data-tab="jobs">Jobs</button>
      <button type="button" data-tab="purchases">Purchases</button>
    </nav>

    <section data-pane="overview">
      <div class="stats" id="stats"></div>
    </section>

    <section data-pane="accounts" hidden>
      <div class="admin-split">
        <div>
          <form id="searchForm" style="display:flex;gap:8px;margin-bottom:16px">
            <input id="search" class="form-input" placeholder="Search by email, name or id" style="max-width:360px">
            <button class="btn btn-secondary" type="submit">Search</button>
          </form>
          <div class="pricing-table-wrap">
            <table class="data-table" id="accounts">
              <thead><tr><th>Account</th><th style="text-align:right">Credits</th><th style="text-align:right">Bought</th><th style="text-align:right">Spent</th><th style="text-align:right">Jobs</th><th>Joined</th><th>Last in</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="muted" id="accountsMore" style="font-size:13px;margin-top:10px"></div>
        </div>
        <aside class="admin-detail" id="detail" hidden></aside>
      </div>
    </section>

    <section data-pane="jobs" hidden>
      <div class="pricing-table-wrap"><table class="data-table" id="jobs"><thead><tr><th>When</th><th>Account</th><th>Tool</th><th style="text-align:right">Credits</th><th>Status</th><th>Job</th></tr></thead><tbody></tbody></table></div>
    </section>

    <section data-pane="purchases" hidden>
      <div class="pricing-table-wrap"><table class="data-table" id="purchases"><thead><tr><th>When</th><th>Account</th><th>Pack</th><th style="text-align:right">Credits</th><th style="text-align:right">Paid</th><th>Stripe session</th></tr></thead><tbody></tbody></table></div>
    </section>
  </main>

  <div class="banner-toast" id="toast" hidden></div>
  <script type="module" src="/admin.js"></script>
</body>
</html>
