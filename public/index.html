<style>

:root{--acc:#8fc2ff}

// ---------------------------------------------------------------- the back: its opposite (drawn light on black, shown as ink on paper)
// THE OPPOSITE OF THE ATOM: antihydrogen. A positron (the electron's mirror, charge +) round an antiproton
// (charge -). Its clouds are the same |psi|^2 as hydrogen's, shown here with the two signs of the wave swapped.
// When matter and antimatter meet they annihilate: all their mass becomes energy (E = mc^2: for one hydrogen atom
// and one anti-atom, 1,878 MeV, about nine times the energy of a uranium fission). The electron and positron give
// two gamma rays flying back to back (511 keV each, so momentum is conserved); the proton and antiproton give a spray

    else if (gone) { H3.label(x, 'they touch: both are gone', cx, cy - Math.min(W, H) * 0.2, 'center', '#fff', 14); H3.label(x, 'all of their mass became light: E = mc², 1,878 MeV', cx, cy + Math.min(W, H) * 0.24, 'center', 'rgba(214,228,255,.9)', 12); H3.label(x, 'two gamma rays, back to back', cx + Math.min(W, H) * 0.2, cy - Math.min(W, H) * 0.14, 'left', '#fff', 11); }
