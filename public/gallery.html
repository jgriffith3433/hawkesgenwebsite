<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play games · Hawkes Gen</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/public.css">
  <link rel="stylesheet" href="/builder.css">
  <script src="https://gen.hawkesgen.com/sdk/analytics@1.js" data-product="hawkesgen" defer></script>
</head>
<body>
  <header class="bar">
    <a class="hg-brand" href="/"><img src="/favicon.svg" alt=""><span>Hawkes Gen</span></a>
    <span class="grow"></span>
    <a class="btn btn-ghost btn-sm" href="/app">Your games</a>
    <a class="btn btn-ghost btn-sm" href="/app/studio">Asset studio</a>
    <a class="btn btn-secondary btn-sm" href="#" data-open-auth="signup">Start building</a>
  </header>

  <main class="page">
    <div class="gallery-head">
      <div>
        <h1>Play games</h1>
        <p class="lede">Made by people like you, with friends and AI.</p>
      </div>
      <div class="segmented">
        <button type="button" class="on" data-sort="popular">Popular</button>
        <button type="button" data-sort="new">New</button>
      </div>
    </div>

    <div class="game-grid" id="gameGrid"></div>

    <div id="empty" class="empty" hidden>
      No games yet. <a href="/app">Be the first to build one!</a>
    </div>
  </main>

  <!-- Play Modal -->
  <div class="modal-backdrop" id="playModal" hidden>
    <div class="modal" style="max-width:90vw;max-height:90vh;padding:0;background:#111">
      <div style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--paper);border-bottom:1px solid var(--rule)">
        <span class="grow" id="playTitle" style="font-weight:600"></span>
        <a class="btn btn-ghost btn-sm" id="playAuthor" style="text-decoration:none"></a>
        <button class="btn btn-ghost btn-sm" data-close="playModal">✕</button>
      </div>
      <iframe id="playFrame" style="width:90vw;height:80vh;border:0;display:block" sandbox="allow-scripts allow-pointer-lock allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-backdrop" id="authModal" hidden>
    <div class="auth-box">
      <span class="label">Hawkes Gen</span>
      <h1 id="authTitle">Build games with friends and AI.</h1>
      <p class="muted" style="margin:0">Sign in to start building.</p>
      <a class="btn btn-secondary btn-lg" href="/auth/google?next=/app" style="width:100%">Continue with Google</a>
      <div class="segmented">
        <button type="button" class="on" id="tabSignup">New account</button>
        <button type="button" id="tabLogin">Sign in</button>
      </div>
      <form id="authForm" class="form-grid">
        <div class="form-field" id="nameWrap">
          <label for="name">Your name</label>
          <input class="form-input" id="name" autocomplete="name" placeholder="What friends call you">
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input class="form-input" id="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input class="form-input" id="password" type="password" minlength="8" autocomplete="current-password" required>
        </div>
        <div class="form-error" id="authError" hidden></div>
        <button class="btn btn-primary btn-lg" type="submit" id="authSubmit">Create account</button>
      </form>
      <button class="btn btn-ghost btn-sm" data-close="authModal" style="margin-top:8px">Cancel</button>
    </div>
  </div>

  <script type="module" src="/gallery.js"></script>
</body>
</html>
