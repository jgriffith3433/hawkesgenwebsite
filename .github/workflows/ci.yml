# Typecheck and tests on pushes to main and on every pull request. The portal box deploys a commit on main only after
# this passes (deploy/pull.mjs checks the commit's check runs). A branch is tested once, through its pull request; beta
# isn't tested again on push, since what lands there already passed in its pull request (J, 2026-10-25: Actions
# minutes ran out, most of them here).
name: CI
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same pull request cancels its older run; runs on main are never cancelled (each one deploys).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Docs-only changes (docs/, *.md) skip the install, typecheck and tests, but the job still reports success: the
      # box's deploy reads this check, so it must exist.
      - name: What changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git fetch -q --no-tags --depth=1 origin "$BASE"; then
            files=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$files" ] && ! echo "$files" | grep -qvE '(^docs/|\.md$)'; then code=false; echo "Docs only: skipping typecheck and tests"; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.changed.outputs.code == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.changed.outputs.code == 'true'
        run: npm run typecheck
      # npm test's two commands, with a test file on every core: Node's default is one fewer than the cores, which on a
      # 2-core runner is one file at a time, and the engine tests are CPU-bound simulations (about 8 minutes serial).
      - if: steps.changed.outputs.code == 'true'
        run: |
          echo "cores: $(nproc)"
          node --disable-warning=ExperimentalWarning --test --test-concurrency=$(nproc) "test/**/*.test.ts"
          node --disable-warning=ExperimentalWarning --test test/engine/net.multi.ts
