# Adds a new version of one of the portal's Secret Manager secrets (Firebase Functions read them) from the GitHub secret
# of the same name in the lane's environment: staging (hawkes-staging, from beta) or production (hawkes-prod, from main).
# The value goes to gcloud on stdin. As ops-secrets@<project>, which may only add versions to these seven secrets.
# The portal's WIF providers trust beta for hawkes-staging and main for hawkes-prod, so dispatch staging with --ref beta
# and prod with --ref main. Then redeploy the lane (push, or the Firebase workflow) so Functions pick up :latest.
#   gh workflow run ops-secret-put.yml --repo jgriffith3433/hawkesgenwebsite --ref beta -f project=staging -f secret=RESEND_API_KEY
#   gh workflow run ops-secret-put.yml --repo jgriffith3433/hawkesgenwebsite --ref main -f project=prod -f secret=STRIPE_SECRET_KEY
name: ops-secret-put
on:
  workflow_dispatch:
    inputs:
      project:
        type: choice
        options: [staging, prod]
        default: staging
      secret:
        type: choice
        options:
          - GOOGLE_CLIENT_SECRET
          - HAWKESGEN_KEY
          - PORTAL_PLATFORM_KEY
          - PORTAL_SIGNING_KEY
          - RESEND_API_KEY
          - STRIPE_SECRET_KEY
          - STRIPE_WEBHOOK_SECRET
permissions:
  contents: read
  id-token: write
concurrency:
  group: ops-secret-put-${{ inputs.project }}
  cancel-in-progress: false
jobs:
  put:
    name: Add a secret version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.project == 'prod' && 'production' || 'staging' }}
    steps:
      - name: The project
        run: |
          if [ "${{ inputs.project }}" = prod ]; then
            echo "PROJECT=${{ vars.GCP_PROJECT_PROD }}" >> "$GITHUB_ENV"; echo "NUMBER=${{ vars.GCP_PROJECT_NUMBER_PROD }}" >> "$GITHUB_ENV"
          else
            echo "PROJECT=${{ vars.GCP_PROJECT_STAGING }}" >> "$GITHUB_ENV"; echo "NUMBER=${{ vars.GCP_PROJECT_NUMBER_STAGING }}" >> "$GITHUB_ENV"
          fi
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ops-secrets@${{ env.PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Add the version
        env:
          NAME: ${{ inputs.secret }}
          VALUE: ${{ secrets[inputs.secret] }}
        run: |
          [ -n "$VALUE" ] || { echo "The GitHub secret $NAME is empty in this environment"; exit 1; }
          printf '%s' "$VALUE" | gcloud secrets versions add "$NAME" --project "$PROJECT" --data-file=- --format='value(name)'
          echo "Added a version to $NAME in $PROJECT. Redeploy the lane so Functions read it." >> "$GITHUB_STEP_SUMMARY"
